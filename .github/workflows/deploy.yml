name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Define SUPABASE_URL e SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions → Variables.
      # Se não estiverem definidas, usa-se o ficheiro src/environments/environment.prod.ts tal como está no repositório.
      - name: Configure Supabase environment
        if: ${{ vars.SUPABASE_URL != '' }}
        run: |
          cat > src/environments/environment.prod.ts <<EOT
          export const environment = {
            production: true,
            supabaseUrl: '${{ vars.SUPABASE_URL }}',
            supabaseAnonKey: '${{ vars.SUPABASE_ANON_KEY }}',
          };
          EOT

      - name: Build
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback for GitHub Pages
        run: cp dist/myfinances/browser/index.html dist/myfinances/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/myfinances/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
