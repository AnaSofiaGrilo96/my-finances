<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fd16b"/>
      <stop offset="1" stop-color="#00883f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- fundo (quadrado arredondado; a versão maskable usa fundo cheio) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="256" rx="112" fill="url(#sheen)"/>
  <!-- carteira -->
  <g transform="translate(96 132)">
    <rect x="0" y="24" width="320" height="224" rx="40" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="0" y="48" width="320" height="200" rx="40" fill="#ffffff"/>
    <!-- aba/fecho da carteira -->
    <rect x="200" y="112" width="140" height="80" rx="28" fill="#0a9a4c"/>
    <circle cx="268" cy="152" r="18" fill="#ffffff"/>
    <!-- símbolo do euro -->
    <text x="104" y="190" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-weight="700" font-size="128" fill="#0a9a4c">€</text>
  </g>
</svg>
